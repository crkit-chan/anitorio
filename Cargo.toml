[package]
name = "anitorio_wasm"
description = "A Factorio blueprint generator for GIF (or WebP) images."
version = "0.3.0"
edition = "2024"
repository = "https://github.com/crkit-chan/anitorio"
license = "Apache-2.0"
keywords = ["factorio", "blueprint", "gif", "webp", "image"]
categories = ["multimedia::images", "multimedia::encoding"]


[lib]
crate-type = ["cdylib"]


[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
big_endian_bytes = "warn"
bool_to_int_with_if = "warn"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
decimal_literal_representation = "warn"
deref_by_slicing = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
future_not_send = "allow"
match_wildcard_for_single_variants = "allow"
too_many_lines = "allow"


[dependencies]
async-channel = "2"
base64 = "0.23"
console_error_panic_hook = { version = "0.1" }
flate2 = { version = "1.1.10", default-features = false, features = [
    "zlib-rs",
    "runtime_detection",
] }
futures-lite = "2"
glam = { version = "0.33.8", features = ["serde"] }
image = { version = "0.24", default-features = false, features = [
    "gif",
    "webp",
] }
js-sys = "0.3.77"
paste = "1.0"
rayon = "1"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde-wasm-bindgen = "0.6"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.77"
wasm-bindgen-rayon = "1"
wasm-tracing-allocator = { version = "0.1.1", optional = true }
web-sys = { version = "0.3", features = ["console"] }
zenflate = "0.4.1"


[profile.profiling]
inherits = "dev"
debug = true
strip = false


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false


[package.metadata.wasm-pack.profile.profiling]
wasm-opt = [
    "-O3",
    "-g",
    "--enable-simd",
    "--enable-threads",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O3",
    "--enable-simd",
    "--enable-threads",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
]


[package.metadata.wasm-pack.profile.profiling.wasm-bindgen]
debug-js-glue = true
demangle-name-section = true


[features]
default = []
profiling = ["dep:wasm-tracing-allocator"]
