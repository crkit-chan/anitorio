[package]
name = "anitorio_wasm"
description = "A Factorio blueprint generator for GIF (or WebP) images."
version = "0.3.0"
edition = "2024"
repository = "https://github.com/crkit-chan/anitorio"
license = "Apache-2.0"
keywords = ["factorio", "blueprint", "gif", "webp", "image"]
categories = ["multimedia::images", "multimedia::encoding"]


[lib]
crate-type = ["cdylib"]


[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"


[dependencies]
base64 = "0.23"
console_error_panic_hook = { version = "0.1", optional = true }
flate2 = { version = "1.0.17", default-features = false, features = [
    "zlib-rs",
] }
glam = { version = "0.33.8", features = ["serde"] }
image = { version = "0.24", default-features = false, features = [
    "gif",
    "webp",
] }
js-sys = "0.3.77"
paste = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
tsify = { version = "0.5.8", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.77"
wasm-tracing-allocator = { version = "0.1.1", optional = true }
web-sys = { version = "0.3", features = ["console"] }


[profile.release]
strip = false
debug = true


[profile.release-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
panic = "abort"


[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O3",
    "-g",
    "--enable-simd",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
]


[package.metadata.wasm-pack.profile.custom]
wasm-opt = [
    "-O3",
    "--enable-simd",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
]


[package.metadata.wasm-pack.profile.release.wasm-bindgen]
demangle-name-section = true


[features]
default = []
profiling = ["dep:console_error_panic_hook", "dep:wasm-tracing-allocator"]
