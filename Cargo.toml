[package]
name = "anitorio_wasm"
description = "A Factorio blueprint generator for GIF (or WebP) images."
version = "0.3.0"
edition = "2024"
repository = "https://github.com/crkit-chan/anitorio"
license = "Apache-2.0"
keywords = ["factorio", "blueprint", "gif", "webp", "image"]
categories = ["multimedia::images", "multimedia::encoding"]


[lib]
crate-type = ["cdylib"]


[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
big_endian_bytes = "warn"
bool_to_int_with_if = "warn"                  # More concise
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
decimal_literal_representation = "warn"
deref_by_slicing = "warn"
empty_enum_variants_with_brackets = "warn"    # Utility
empty_structs_with_brackets = "warn"
expect_used = "warn"                          # Yes, I want clean errors
future_not_send = "allow"                     # Used a lot due to WASM / JS code
get_unwrap = "warn"
host_endian_bytes = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"                        # Cool
integer_division_remainder_used = "warn"
let_underscore_must_use = "warn"              # utility
let_underscore_untyped = "warn"               # Utility
lossy_float_literal = "warn"                  # Useful
map_err_ignore = "warn"
map_with_unused_argument_over_ranges = "warn"
match_wildcard_for_single_variants = "allow"  # I do this quite a lot
missing_assert_message = "warn"               # Debugging utility
mixed_read_write_in_expression = "warn"
modulo_arithmetic = "warn"
multiple_inherent_impl = "warn"
multiple_unsafe_ops_per_block = "warn"        # Useful but in SIMD :skull:
mutex_atomic = "warn"                         # Utility lint
mutex_integer = "warn"                        # Utility lint
panic = "warn"                                # All functions should return error instead of panicking
pattern_type_mismatch = "warn"                # Utility
precedence_bits = "warn"
non_ascii_literal = "warn"                    # Utility lint
redundant_test_prefix = "warn"                # Yes
renamed_function_params = "warn"              # Useful
return_and_then = "warn"                      # Cool
semicolon_outside_block = "warn"              # Allows more compact code
str_to_str = "warn"                           # I prefer String::to_owned()
string_lit_chars_any = "warn"                 # Stylistic preference
todo = "warn"                                 # Utility
too_many_lines = "allow"                      # Ya
try_err = "warn"                              # Readability
unimplemented = "warn"                        # Useful
unneeded_field_pattern = "warn"               # Clarity / brevity
unseparated_literal_suffix = "warn"           # Readability
unused_trait_names = "warn"                   # Clarify intent
unwrap_used = "warn"                          # WE WANT ERRORS

# single_call_fn = "warn" # Useful debug tool
# undocumented_unsafe_blocks = "warn"           # Give a good reason to use unsafe blocks


[dependencies]
anitorio_macros = { path = "src/macros" }
async-channel = { version = "2", optional = true }
base64 = "0.23"
bytemuck = "1.25.2"
console_error_panic_hook = { version = "0.1" }
flate2 = { version = "1.1.10", default-features = false, features = [
    "zlib-rs",
] }
futures-lite = { version = "2", optional = true }
glam = { version = "0.33.8", features = ["bytemuck", "serde"] }
image = { version = "0.24", default-features = false, features = [
    "gif",
    "webp",
] }
imagequant = { version = "4.4.1", default-features = false }
indexmap = { version = "2", features = ["serde"] }
js-sys = "0.3.77"
kiddo = { version = "6.3.1", optional = true, default-features = false, features = [
    "fixed",
    "simd",
] }
ordered-float = { version = "5.0", default-features = false, features = [
    "serde",
] }
paste = "1.0"
rayon = { version = "1.10.0", optional = true, features = ["web_spin_lock"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde-wasm-bindgen = "0.6"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.77"
wasm-bindgen-rayon = { version = "1", optional = true }
wasm-tracing-allocator = { version = "0.1.1", optional = true }
web-sys = { version = "0.3", features = ["console"] }


[profile.dev]
opt-level = 2
debug = true
incremental = true


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
incremental = true
strip = "debuginfo"


[package.metadata.wasm-pack.profile.profiling]
wasm-opt = [
    "-O3",
    "-g",
    "--enable-simd",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O4",
    "--enable-simd",
    "--enable-threads",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
debug-js-glue = true
demangle-name-section = true


[package.metadata.wasm-pack.profile.profiling.wasm-bindgen]
debug-js-glue = true
demangle-name-section = true


[features]
arc_blueprint_generator = []
default = []
kiddo = ["dep:kiddo"]
perf_timing = [
    "web-sys/Performance",
    "web-sys/Window",
    "web-sys/WorkerGlobalScope",
]
profiling = ["dep:wasm-tracing-allocator"]
release = []
threads = [
    "dep:async-channel",
    "dep:futures-lite",
    "dep:rayon",
    "dep:wasm-bindgen-rayon",
    "image/rayon",
    "imagequant/threads",
]
