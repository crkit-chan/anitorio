exclude = [".git", "__pycache__", "venv", "mlx_vlm"]
line-length = 200


[format]
docstring-code-format = true
preview = true
quote-style = "double"
skip-magic-trailing-comma = true


[lint]
ignore = ["E702", "E741"]


[lint.isort]
combine-as-imports = true
force-single-line = false
force-sort-within-sections = true
